usage: app [OPTIONS] <FILE>

Options:
Group <default> (the default category for options):
  -v|--verbose                    Show more
  <FILE>                          no description provided

Group <mode> (one mode at a time), exclusive with other groups:
  --list                          List them
  --a-long-option-name-indeed <VALUE>
                                  Reaches the help column


