[workspace]
name = "kotatsu"
version = "0.1.0"
description = "A simple C++20 coroutine wrapper for libuv"
authors = ["ykiko <ykikoykikoykiko@gmail.com>"]
license = "Apache-2.0"
license-file = "LICENSE"
readme = "README.md"
documentation = "https://clice.io"
repository = "https://github.com/clice-io/kotatsu"
channels = ["conda-forge", "https://conda.clice.io"]
platforms = ["win-64", "linux-64", "osx-arm64"]

[environments]
# The toolchain features are target-scoped, so combining them gives the
# default environment a platform-native reproducible toolchain everywhere:
# clang on linux-64/osx-arm64, self-contained mingw gcc on win-64 (msvc and
# clang-cl need a VS developer environment, so they stay opt-in).
default = ["build", "linux-clang", "macos-clang", "windows-mingw"]
# Build tools only — for builds that deliberately use the system toolchain
# (e.g. the CI apple-clang job, or MSVC from a VS developer prompt).
system = ["build"]
linux-gcc = ["build", "linux-gcc"]
linux-clang = ["build", "linux-clang"]
macos-clang = ["build", "macos-clang"]
windows-msvc = ["build", "windows-msvc"]
windows-mingw = ["build", "windows-mingw"]
windows-llvm = ["build", "windows-llvm"]
windows-xclang = ["build", "windows-xclang"]
bazel = ["build", "bazel"]
format = ["format"]

# Shared by every environment: the TypeScript tooling under scripts/ runs in
# the dev environments and in `format`, which CI's format job uses. Node 24
# runs `.ts` directly by stripping the types, so there is no build step.
[dependencies]
nodejs = "24.*"

[feature.build.dependencies]
python = "*"
cmake = ">=3.25"
ninja = "*"
# 4.14 turns direct mode off for any translation unit whose headers contain
# the text "#embed".
ccache = "4.13.*"
openssl = "*"

[feature.linux-gcc.target.linux-64.dependencies]
sysroot_linux-64 = "==2.17"
gcc = "==14.2.0"
gxx = "==14.2.0"

[feature.linux-gcc.target.linux-64.activation.env]
CC = "gcc"
CXX = "g++"

[feature.linux-clang.target.linux-64.dependencies]
sysroot_linux-64 = "==2.17"
clang = "==20.1.8"
clangxx = "==20.1.8"
lld = "==20.1.8"
llvm-tools = "==20.1.8"
compiler-rt = "==20.1.8"
# Keep clang's C++ standard library aligned with the linux-gcc toolchain pin;
# unpinned, the devel headers drift ahead of the libstdcxx runtime.
libstdcxx-devel_linux-64 = "==14.2.0"
libgcc-devel_linux-64 = "==14.2.0"

[feature.linux-clang.target.linux-64.activation.env]
CC = "clang"
CXX = "clang++"

[feature.macos-clang.target.osx-arm64.dependencies]
clang = "==22.1.8"
clangxx = "==22.1.8"
lld = "==22.1.8"
llvm-tools = "==22.1.8"
compiler-rt = "==22.1.8"
libcxx = "==22.1.8"

[feature.macos-clang.target.osx-arm64.activation.env]
CC = "clang"
CXX = "clang++"

[feature.windows-mingw.target.win-64.dependencies]
gcc = "==14.2.0"
gxx = "==14.2.0"
sccache = "*"

[feature.windows-mingw.target.win-64.activation.env]
PATH = "%CONDA_PREFIX%\\Library\\bin;%PATH%"
CC = "gcc"
CXX = "g++"

[feature.windows-msvc.target.win-64.dependencies]
sccache = "*"

[feature.windows-llvm.target.win-64.dependencies]
clang = "==20.1.8"
clangxx = "==20.1.8"
lld = "==20.1.8"
llvm-tools = "==20.1.8"
compiler-rt = "==20.1.8"
sccache = "*"

[feature.windows-llvm.target.win-64.activation]
scripts = ["scripts/activate_windows_llvm.bat"]

# MinGW with libc++ rather than libstdc++: xclang (clice-io/xclang), whose
# clang targets x86_64-w64-mingw32 with its own libc++ and runtimes.
[feature.windows-xclang.target.win-64.dependencies]
xclang = "==23.1.2.2"
sccache = "*"

# Bazel (MODULE.bazel), whose toolchain is xclang's module: it downloads
# xclang's release for the host itself. Bazel itself is the release
# .bazelversion names, fetched by bazelisk (an npm package): conda-forge's
# build runs only in batch mode, with its output inside the environment.
# `pixi run -e bazel bazel <command> <targets>` runs it; zest's runner check
# runs on cmake.
[feature.bazel.tasks.bazel]
cmd = "npx --no -- bazelisk"
depends-on = ["npm-ci"]

# Bazel's default output root is too deep for Windows paths, and without
# symlinks its runfiles hold copies, from which the integration tests cannot
# find the source tree (bazel/command_test.ts).
[feature.bazel.target.win-64.tasks.bazel]
cmd = "npx --no -- bazelisk --output_user_root=C:/b --windows_enable_symlinks"
depends-on = ["npm-ci"]

# ============================================================================== #
#                                    FORMAT                                      #
# ============================================================================== #
[feature.format.dependencies]
ruff = "*"
tombi = "*"
stylua = "*"
fd-find = "*"
prettier = "*"
clang-format = "==21.1.8"

[feature.format.tasks]
format-cpp = "fd -H -e cpp -e h -e cc -e hpp -E include/kota/ipc/lsp/protocol.h -E include/kota/ipc/lsp/range.h -x clang-format -i"
format-python = "ruff format ."
format-lua = "stylua ."
format-web = "fd -H -e js -e ts -e css -x prettier --write"
format-markdown = "fd -H -e md -x prettier --write"
format-json = "fd -H -e json -E package-lock.json -E metaModel.json -E .git -x prettier --write"
format-toml = "fd -H -e toml -x tombi format"
format-yaml = """
fd -H -e yaml -e yml -E pnpm-lock.yaml -E '*.snap.yml' -x prettier --write && \
fd -H "^\\.clang-(format|tidy)$" -x prettier --write --parser yaml
"""
format = { depends-on = [
    "format-cpp",
    "format-python",
    "format-lua",
    "format-web",
    "format-markdown",
    "format-json",
    "format-toml",
    "format-yaml"
] }

[feature.format.target.win-64.tasks]
format-web = "fd -H -e js -e ts -e css -x prettier.bat --write"
format-markdown = "fd -H -e md -x prettier.bat --write"
format-json = "fd -H -e json -E package-lock.json -E metaModel.json -E .git -x prettier.bat --write"
format-yaml = """
fd -H -e yaml -e yml -E pnpm-lock.yaml -E '*.snap.yml' -x prettier.bat --write && \
fd -H "^\\.clang-(format|tidy)$" -x prettier.bat --write --parser yaml
"""

# Regenerate include/kota/ipc/lsp/protocol.h, its range.h and the tests'
# table of its types; `--check` only verifies them.
[tasks.lsp-codegen]
cmd = "node scripts/lsp/codegen.ts"

# Installs the type checker and the packages the integration tests import (the
# scripts need none); skipped while the package files and node_modules are
# unchanged.
[tasks.npm-ci]
cmd = "npm ci"
inputs = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.typecheck]
cmd = "npx --no -- tsc"
depends-on = ["npm-ci"]

[tasks.configure]
args = [{ arg = "preset", default = "debug" }]
cmd = "cmake --preset {{ preset }}"

[tasks.build]
args = [{ arg = "preset", default = "debug" }]
cmd = "cmake --build --preset {{ preset }}"
depends-on = [{ task = "configure", args = ["{{ preset }}"] }]

[tasks.test]
args = [{ arg = "preset", default = "debug" }]
cmd = "ctest --preset {{ preset }}"
depends-on = [{ task = "build", args = ["{{ preset }}"] }, "npm-ci"]

[tasks.integration-test]
args = [{ arg = "preset", default = "debug" }]
cmd = "ctest --preset {{ preset }} -L integration"
depends-on = [{ task = "build", args = ["{{ preset }}"] }, "npm-ci"]

# Runs every test stage on the `coverage` preset's build and reports how much
# of include/kota and src they reach, per module (scripts/coverage.ts); any
# arguments go to ctest.
[tasks.coverage]
cmd = "node scripts/coverage.ts"
depends-on = [{ task = "build", args = ["coverage"] }, "npm-ci"]
