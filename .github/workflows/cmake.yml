name: cmake

on:
  workflow_call:

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
  npm_config_cache: ${{ github.workspace }}/.cache/npm
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  SCCACHE_BASEDIRS: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: pch_defines,time_macros,locale
  CCACHE_MAXSIZE: 2G
  SCCACHE_CACHE_SIZE: 2G

jobs:
  build:
    name: ${{ matrix.os_label }} | ${{ matrix.toolchain }} | ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # prettier-ignore
      matrix:
        include:
          # Windows - MSVC
          - { os_label: windows, os: windows-2025, toolchain: msvc,        preset: debug }
          - { os_label: windows, os: windows-2025, toolchain: msvc,        preset: asan }
          - { os_label: windows, os: windows-2025, toolchain: msvc,        preset: no-exceptions }

          # Windows - Clang-CL
          - { os_label: windows, os: windows-2025, toolchain: clang-cl,    preset: debug }
          - { os_label: windows, os: windows-2025, toolchain: clang-cl,    preset: relwithdebinfo }
          - { os_label: windows, os: windows-2025, toolchain: clang-cl,    preset: asan }
          - { os_label: windows, os: windows-2025, toolchain: clang-cl,    preset: no-exceptions-no-rtti }

          # Windows - MinGW
          - { os_label: windows, os: windows-2025, toolchain: mingw,       preset: debug }
          - { os_label: windows, os: windows-2025, toolchain: mingw,       preset: relwithdebinfo }
          - { os_label: windows, os: windows-2025, toolchain: mingw,       preset: no-exceptions-no-rtti }

          # Windows - MinGW with libc++ (xclang)
          - { os_label: windows, os: windows-2025, toolchain: xclang,      preset: debug }
          - { os_label: windows, os: windows-2025, toolchain: xclang,      preset: relwithdebinfo }

          # Linux - GCC
          - { os_label: linux,   os: ubuntu-24.04, toolchain: gcc,         preset: debug }
          - { os_label: linux,   os: ubuntu-24.04, toolchain: gcc,         preset: relwithdebinfo }
          - { os_label: linux,   os: ubuntu-24.04, toolchain: gcc,         preset: asan }
          - { os_label: linux,   os: ubuntu-24.04, toolchain: gcc,         preset: ubsan }

          # Linux - Clang
          - { os_label: linux,   os: ubuntu-24.04, toolchain: clang,       preset: debug }
          - { os_label: linux,   os: ubuntu-24.04, toolchain: clang,       preset: asan-ubsan }
          - { os_label: linux,   os: ubuntu-24.04, toolchain: clang,       preset: tsan }
          - { os_label: linux,   os: ubuntu-24.04, toolchain: clang,       preset: no-exceptions }
          - { os_label: linux,   os: ubuntu-24.04, toolchain: clang,       preset: coverage }

          # macOS - Apple Clang
          - { os_label: macos,   os: macos-15,     toolchain: apple-clang, preset: debug }
          - { os_label: macos,   os: macos-15,     toolchain: apple-clang, preset: asan-ubsan }

          # macOS - Clang
          - { os_label: macos,   os: macos-15,     toolchain: clang,       preset: debug }
          - { os_label: macos,   os: macos-15,     toolchain: clang,       preset: relwithdebinfo }
          - { os_label: macos,   os: macos-15,     toolchain: clang,       preset: no-exceptions-no-rtti }

    steps:
      - name: Derive toolchain variables
        shell: bash
        run: |
          # Toolchain-specific: PIXI_ENV, CC, CXX, COMPILER_CACHE, CACHE_KEY, NEEDS_MSVC_ENV,
          # CLANG_NO_DEFAULT_CONFIG
          case "${{ matrix.os_label }}-${{ matrix.toolchain }}" in
            linux-gcc)
              echo "PIXI_ENV=linux-gcc"; echo "CC=gcc"; echo "CXX=g++"; echo "COMPILER_CACHE=ccache"; echo "CACHE_KEY=linux-gcc" ;;
            linux-clang)
              echo "PIXI_ENV=linux-clang"; echo "CC=clang"; echo "CXX=clang++"; echo "COMPILER_CACHE=ccache"; echo "CACHE_KEY=linux-clang" ;;
            macos-apple-clang)
              echo "PIXI_ENV=system"; echo "CC=/usr/bin/clang"; echo "CXX=/usr/bin/clang++"; echo "COMPILER_CACHE=ccache"; echo "CACHE_KEY=macos-appleclang" ;;
            macos-clang)
              echo "PIXI_ENV=macos-clang"; echo "CC=clang"; echo "CXX=clang++"; echo "COMPILER_CACHE=ccache"; echo "CACHE_KEY=macos-clang" ;;
            windows-msvc)
              echo "PIXI_ENV=windows-msvc"; echo "CC=cl"; echo "CXX=cl"; echo "COMPILER_CACHE=sccache"; echo "CACHE_KEY=windows-msvc"; echo "NEEDS_MSVC_ENV=true" ;;
            windows-clang-cl)
              # xclang's clang-cl builds twice as fast as conda-forge's, but
              # xclang has no ASan runtime for the MSVC target, so the ASan leg
              # keeps conda-forge's. xclang's default configuration is MinGW's,
              # which clang-cl must not read.
              if [[ "${{ matrix.preset }}" == "asan" ]]; then
                echo "PIXI_ENV=windows-llvm"
              else
                echo "PIXI_ENV=windows-xclang"; echo "CLANG_NO_DEFAULT_CONFIG=1"
              fi
              echo "CC=clang-cl"; echo "CXX=clang-cl"; echo "COMPILER_CACHE=sccache"; echo "CACHE_KEY=windows-clang-cl"; echo "NEEDS_MSVC_ENV=true" ;;
            windows-mingw)
              echo "PIXI_ENV=windows-mingw"; echo "CC=gcc"; echo "CXX=g++"; echo "COMPILER_CACHE=sccache"; echo "CACHE_KEY=windows-mingw" ;;
            windows-xclang)
              echo "PIXI_ENV=windows-xclang"; echo "CC=clang"; echo "CXX=clang++"; echo "COMPILER_CACHE=sccache"; echo "CACHE_KEY=windows-xclang" ;;
          esac >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.71.1
          environments: ${{ env.PIXI_ENV }}
          activate-environment: true
          cache: false
          locked: true
          # Deleting the environment when the job ends only takes time.
          post-cleanup: false

      - name: Setup MSVC environment
        if: env.NEEDS_MSVC_ENV == 'true'
        uses: ilammy/msvc-dev-cmd@v1

      # Keyed on the files that declare the dependencies, and saved from main
      # right after configure, which fetches them; pull requests reuse main's.
      - name: Restore CPM cache
        id: cpm-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/kota_dependencies.cmake', 'src/*/CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      # The integration tests, which ctest runs, import npm packages.
      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.npm_config_cache }}
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install npm packages
        run: pixi run -e ${{ env.PIXI_ENV }} npm-ci

      # An entry cannot be overwritten, so each run saves a new one keyed on its
      # commit and restores the newest by prefix. GitHub keeps an entry to the
      # ref that saved it and searches the run's own ref before main's, so a
      # pull request starts from its own last run, or else from main.
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.COMPILER_CACHE == 'sccache' && env.SCCACHE_DIR || env.CCACHE_DIR }}
          key: ${{ env.COMPILER_CACHE }}-${{ runner.os }}-${{ env.CACHE_KEY }}-${{ matrix.preset }}/${{ github.sha }}
          restore-keys: ${{ env.COMPILER_CACHE }}-${{ runner.os }}-${{ env.CACHE_KEY }}-${{ matrix.preset }}/

      # pixi's clang builds against Xcode's SDK.
      - name: Setup macOS SDK
        if: runner.os == 'macOS' && env.CC == 'clang'
        shell: bash
        run: |
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          echo "SDKROOT=${sdk}" >> "$GITHUB_ENV"
          echo "CONDA_BUILD_SYSROOT=${sdk}" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${{ env.COMPILER_CACHE }}" == "ccache" ]]; then
            ccache --zero-stats || true
          else
            sccache --zero-stats || true
          fi
          extra_args=()
          if [[ "${{ runner.os }}" == "macOS" && "${{ env.CC }}" == "clang" ]]; then
            extra_args=(
              -DCMAKE_OSX_SYSROOT="${SDKROOT}"
              -DCMAKE_C_FLAGS="--sysroot=${SDKROOT}"
              -DCMAKE_CXX_FLAGS="--sysroot=${SDKROOT}"
              -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld --sysroot=${SDKROOT}"
              -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld --sysroot=${SDKROOT}"
              -DCMAKE_MODULE_LINKER_FLAGS="-fuse-ld=lld --sysroot=${SDKROOT}"
            )
          fi
          # GNU ld takes over a minute to link unit_tests.exe, lld seconds.
          if [[ "${{ matrix.toolchain }}" == "mingw" ]]; then
            extra_args+=(-DCMAKE_LINKER_TYPE=LLD)
          fi

          # ${arr[@]+...} guard: macOS ships bash 3.2, where expanding an
          # empty array under set -u is an unbound-variable error.
          cmake --preset "${{ matrix.preset }}" ${extra_args[@]+"${extra_args[@]}"}

      - name: Save CPM cache
        if: github.ref == 'refs/heads/main' && steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      - name: Build
        id: build
        shell: bash
        run: |
          # "Trim compiler cache" keeps what the build uses from here on, taken
          # a second early since `date +%s` rounds down.
          echo "BUILD_STARTED_AT=$(( $(date +%s) - 1 ))" >> "$GITHUB_ENV"
          cmake --build --preset "${{ matrix.preset }}" --parallel

      - name: Test
        shell: bash
        run: |
          # The coverage script runs ctest itself, then reports; a failing
          # test fails it, the numbers never do.
          if [[ "${{ matrix.preset }}" == "coverage" ]]; then
            node scripts/coverage.ts --verbose
          else
            ctest --preset "${{ matrix.preset }}" --verbose
          fi

      - name: Summarize coverage
        if: ${{ !cancelled() && hashFiles('build/coverage/report/summary.md') != '' }}
        shell: bash
        run: cat build/coverage/report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('build/coverage/report/summary.md') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build/coverage/report/html
            build/coverage/report/coverage.lcov

      - name: Show compiler cache stats
        if: always()
        shell: bash
        run: |
          if [[ "${{ env.COMPILER_CACHE }}" == "ccache" ]]; then
            ccache --show-stats --verbose || true
          else
            sccache --show-stats || true
            sccache --stop-server || true
          fi

      # Drops the objects this build did not use, so that a saved entry holds
      # one build instead of growing to the size limit run after run; both
      # tools refresh an object's mtime when the build uses it. After a failed
      # build nothing is dropped, since what it did not reach is still good.
      - name: Trim compiler cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          if [[ "${COMPILER_CACHE}" == "ccache" ]]; then
            dir="${CCACHE_DIR}"
            ccache --evict-older-than "$(( $(date +%s) - BUILD_STARTED_AT ))s"
          else
            # sccache has no such command; its server, which keeps count of
            # these files, stopped with the stats above. It runs on Windows.
            dir="$(cygpath -u "${SCCACHE_DIR}")"
            find "${dir}" -type f ! -newermt "@${BUILD_STARTED_AT}" -delete
          fi
          du -sh "${dir}"

      # After a failed build too, which keeps what it compiled; the entry
      # replaces the ref's older ones for this leg.
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/replace-cache
        with:
          path: ${{ env.COMPILER_CACHE == 'sccache' && env.SCCACHE_DIR || env.CCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
