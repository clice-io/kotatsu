name: main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      format: ${{ steps.filter.outputs.format }}
      cmake: ${{ steps.filter.outputs.cmake }}
      bazel: ${{ steps.filter.outputs.bazel }}
      xmake: ${{ steps.filter.outputs.xmake }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            format:
              - '**/*.{h,c,cpp,hpp,cmake,lua,md,yml,yaml,toml,py,ts,json}'
            cmake:
              - 'src/**'
              - 'include/**'
              - 'cmake/**'
              - 'tests/**'
              - 'examples/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'pixi.toml'
              - 'package*.json'
              - 'tsconfig.json'
              - 'scripts/**'
              - '.github/actions/**'
              - '.github/workflows/main.yml'
              - '.github/workflows/cmake.yml'
            bazel:
              - 'src/**'
              - 'include/**'
              - 'tests/**'
              - 'examples/**'
              - 'bazel/**'
              - '**/BUILD.bazel'
              - 'MODULE.bazel'
              - '.bazel*'
              - 'pixi.toml'
              - 'pixi.lock'
              - 'package*.json'
              - '.github/actions/**'
              - '.github/workflows/main.yml'
              - '.github/workflows/bazel.yml'
            xmake:
              - 'src/**'
              - 'include/**'
              - 'tests/**'
              - 'examples/**'
              - 'xmake.lua'
              - 'pixi.toml'
              - '.github/actions/**'
              - '.github/scripts/xmake_cache.lua'
              - '.github/workflows/main.yml'
              - '.github/workflows/xmake.yml'

  format:
    needs: changes
    if: ${{ needs.changes.outputs.format == 'true' }}
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/check-format.yml
    with:
      is_pull_request: ${{ github.event_name == 'pull_request' }}

  cmake:
    needs: changes
    if: ${{ needs.changes.outputs.cmake == 'true' }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/cmake.yml

  bazel:
    needs: changes
    if: ${{ needs.changes.outputs.bazel == 'true' }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/bazel.yml

  xmake:
    needs: changes
    if: ${{ needs.changes.outputs.xmake == 'true' }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/xmake.yml

  # Every commit of main that passed bazel.yml is a version of the kotatsu
  # module on the clice Bazel registry (https://bazel.clice.io):
  # 0.1.0.<n> for the n-th commit of main, MODULE.bazel's version and the
  # commit's count. Its source archive is the commit's tree, published
  # through clice-io/bazel's action.
  publish-bazel:
    needs: bazel
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.bazel.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Module archive
        run: |
          base=$(sed -n 's/^    version = "\(.*\)",$/\1/p' MODULE.bazel)
          version="${base}.$(git rev-list --count HEAD)"
          dir="kotatsu-${version}"
          stage="${RUNNER_TEMP}/module"
          mkdir -p "${stage}" dist
          git archive --prefix="${dir}/" HEAD | tar -x -C "${stage}"
          sed -i "s/^    version = \"${base}\",$/    version = \"${version}\",/" "${stage}/${dir}/MODULE.bazel"
          grep -q "version = \"${version}\"" "${stage}/${dir}/MODULE.bazel"
          tar -C "${stage}" --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - "${dir}" | gzip -9n > "dist/${dir}.tar.gz"
          echo "kotatsu ${version} ($(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"

      - uses: clice-io/bazel@main
        with:
          archives: dist/kotatsu-*.tar.gz
          token: ${{ secrets.UPLOAD_BAZEL }}

  checks-passed:
    if: ${{ always() }}
    needs:
      - format
      - cmake
      - bazel
      - xmake
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        uses: re-actors/alls-green@release/v1
        with:
          allowed-skips: format,cmake,bazel,xmake
          jobs: ${{ toJSON(needs) }}
