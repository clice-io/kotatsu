name: Delete replaced caches
description: >-
  Deletes the cache entries that a newly saved one replaces: those of the run's
  ref whose key has the same prefix, up to the last "/". They would otherwise
  sit in the repository's cache pool until evicted. Nothing is deleted until the
  new entry is listed, since a failed save only warns.

inputs:
  key:
    description: The key of the entry just saved, "<prefix>/<version>".
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        KEY: ${{ inputs.key }}
      run: |
        gh cache list --ref "${GITHUB_REF}" --key "${KEY%/*}/" --limit 100 --json id,key \
            --jq "if any(.[]; .key == \"${KEY}\") then .[] | select(.key != \"${KEY}\") | .id else empty end" |
          while read -r id; do gh cache delete "${id}"; done
