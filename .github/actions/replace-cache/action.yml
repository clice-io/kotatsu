name: Replace cache
description: >-
  Saves a cache entry, then deletes the entries of the run's ref that it
  replaces: those whose key has the same part up to the last "/". They would
  otherwise sit in the repository's cache pool until evicted. Nothing is saved
  from a fork, whose token cannot delete them.

inputs:
  path:
    description: The files to save.
    required: true
  key:
    description: The new entry's key.
    required: true

runs:
  using: composite
  steps:
    - id: save
      if: ${{ !github.event.pull_request.head.repo.fork }}
      uses: actions/cache/save@v4
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}

    # A failed save only warns, so the older entries go only once the new one
    # is listed; entries saved since, by a concurrent run on main, stay. A
    # failure here only leaves them.
    - if: steps.save.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        KEY: ${{ inputs.key }}
      run: |
        gh cache list --ref "${GITHUB_REF}" --key "${KEY%/*}/" --limit 100 --json id,key,createdAt \
            --jq "(.[] | select(.key == \"${KEY}\") | .createdAt) as \$saved | .[] | select(.createdAt < \$saved) | .id" |
          while read -r id; do gh cache delete "${id}"; done
